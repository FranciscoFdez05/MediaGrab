name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Tests, compilación y empaquetado
        shell: pwsh
        run: ./build.ps1

      - name: Publicar los archivos de la release como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab
          path: dist/*
